server {
    listen 80;
    server_name _;
    root /var/www/baikal/html;
    index index.php;
    charset utf-8;
    server_tokens off;

    # Standard CalDAV/CardDAV discovery.
    location = /.well-known/caldav { return 301 /dav.php; }
    location = /.well-known/carddav { return 301 /dav.php; }

    # Only the public html directory is available over HTTP.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php(?:/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 120s;
    }

    location ~ /\. { return 404; }
    location ~* /(Core|Specific|config)/ { return 404; }
}
