
services:
  baikal:
    build:
      context: .
      dockerfile: Dockerfile
    image: baikal-nginx-local:latest
    pull_policy: build
    restart: always
    ports:
      - "43444:80"
    volumes:
      - /volume1/docker/baikal/config:/var/www/baikal/config
      - /volume1/docker/baikal/data:/var/www/baikal/Specific
